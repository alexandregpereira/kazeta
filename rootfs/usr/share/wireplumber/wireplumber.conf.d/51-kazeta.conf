wireplumber.settings = {
  device.routes.default-sink-volume = 0.9
}

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\..*\\.hdmi.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1300
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output\\.usb-.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1400
      }
    }
  }
  {
    # disable the audio card of PlayStation controllers (DualShock 4, DualSense,
    # DualSense Edge over USB): it would become the default output, and on the
    # DualSense audio reaching channels 3-4 drives the haptic motors (stuck rumble)
    matches = [
      { device.name = "~alsa_card\\.usb-Sony_Interactive_Entertainment_.*Wireless_Controller.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
