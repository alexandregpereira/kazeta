# Xbox Wireless Controller over Bluetooth, read from the kernel's hid-microsoft event device
# (see devices.d/60-xbox_one_bt_gamepad.yaml). Same as dinput_generic (right stick on ABS_Z/ABS_RZ,
# triggers on ABS_BRAKE/ABS_GAS), without the paddles the controller reports but does not have,
# and with Share, which comes as KEY_RECORD.
version: 2
kind: CapabilityMap
name: Xbox Wireless Controller (Bluetooth event device)
id: xbox_bt_evdev
mapping:
  - name: Guide Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_MODE
          value_type: button
    target_event:
      gamepad:
        button: Guide

  - name: South Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SOUTH
          value_type: button
    target_event:
      gamepad:
        button: South

  - name: West Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_WEST
          value_type: button
    target_event:
      gamepad:
        button: West

  - name: North Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_NORTH
          value_type: button
    target_event:
      gamepad:
        button: North

  - name: East Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_EAST
          value_type: button
    target_event:
      gamepad:
        button: East

  - name: Start Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_START
          value_type: button
    target_event:
      gamepad:
        button: Start

  - name: Select Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_SELECT
          value_type: button
    target_event:
      gamepad:
        button: Select

  - name: Right Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_GAS
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: RightTrigger

  - name: Left Trigger
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_BRAKE
          value_type: trigger
    target_event:
      gamepad:
        trigger:
          name: LeftTrigger

  - name: Right Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TR
          value_type: button
    target_event:
      gamepad:
        button: RightBumper

  - name: Left Bumper
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_TL
          value_type: button
    target_event:
      gamepad:
        button: LeftBumper

  - name: Right Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_Z
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_RZ
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: RightStick

  - name: Left Stick
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_X
          value_type: joystick_x
      - evdev:
          event_type: ABS
          event_code: ABS_Y
          value_type: joystick_y
    target_event:
      gamepad:
        axis:
          name: LeftStick

  - name: Right Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBR
          value_type: button
    target_event:
      gamepad:
        button: RightStick

  - name: Left Stick Click
    source_events:
      - evdev:
          event_type: KEY
          event_code: BTN_THUMBL
          value_type: button
    target_event:
      gamepad:
        button: LeftStick

  - name: Dpad Left
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadLeft

  - name: Dpad Right
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0X
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadRight

  - name: Dpad Down
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: positive
    target_event:
      gamepad:
        button: DPadDown

  - name: Dpad Up
    source_events:
      - evdev:
          event_type: ABS
          event_code: ABS_HAT0Y
          value_type: button
          axis_direction: negative
    target_event:
      gamepad:
        button: DPadUp

  - name: Share Button
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_RECORD
          value_type: button
    target_event:
      gamepad:
        button: Screenshot
